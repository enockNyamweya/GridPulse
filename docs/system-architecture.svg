<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="100%" height="100%" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
  <defs>
    <marker id="arrowZinc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#A1A1AA"/>
    </marker>
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981"/>
    </marker>
  </defs>

  <rect width="1120" height="560" rx="8" fill="#09090B" stroke="#27272A" stroke-width="1.5"/>

  <rect x="24" y="20" width="1072" height="44" rx="4" fill="#121215" stroke="#27272A" stroke-width="1"/>
  <text x="40" y="47" fill="#F4F4F5" font-size="14" font-weight="700" letter-spacing="0.8">GRIDPULSE ARCHITECTURE: TELEMETRY ENGINE, SUBSYSTEMS &amp; DUAL WORKSPACE UI</text>
  <text x="1080" y="47" fill="#10B981" font-size="11" font-weight="600" text-anchor="end">NOMINAL BUS: 50.00 HZ / 240.0 V</text>

  <rect x="24" y="82" width="244" height="454" rx="6" fill="#121215" stroke="#27272A" stroke-width="1.2"/>
  <rect x="24" y="82" width="244" height="32" rx="6" fill="#18181B"/>
  <text x="146" y="103" fill="#E4E4E7" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.8">1. FIELD TELEMETRY LAYER</text>

  <rect x="40" y="130" width="212" height="76" rx="4" fill="#09090B" stroke="#3F3F46" stroke-width="1"/>
  <text x="52" y="150" fill="#F4F4F5" font-size="11" font-weight="700">6-Node Kenyan Grid Twin</text>
  <text x="52" y="168" fill="#A1A1AA" font-size="10">GEN-OLK-01 (450 kW Geo)</text>
  <text x="52" y="183" fill="#A1A1AA" font-size="10">GEN-SOL-02 (280 kW PV)</text>
  <text x="52" y="198" fill="#A1A1AA" font-size="10">TR-NRB-04 / BESS / Loads</text>

  <rect x="40" y="222" width="212" height="84" rx="4" fill="#09090B" stroke="#3F3F46" stroke-width="1"/>
  <text x="52" y="242" fill="#F4F4F5" font-size="11" font-weight="700">RTUBinaryCodec (64-Bit)</text>
  <text x="52" y="260" fill="#A1A1AA" font-size="10">0xA5 Sync + ID/Flags Byte</text>
  <text x="52" y="275" fill="#A1A1AA" font-size="10">16-bit V (dV) &amp; Freq (cHz)</text>
  <text x="52" y="290" fill="#10B981" font-size="10">CRC-8 (Poly 0x07) verify</text>

  <rect x="40" y="322" width="212" height="92" rx="4" fill="#09090B" stroke="#3F3F46" stroke-width="1"/>
  <text x="52" y="342" fill="#F4F4F5" font-size="11" font-weight="700">IEC 60076-7 Thermal Solver</text>
  <text x="52" y="360" fill="#A1A1AA" font-size="10">50 Hz swing droop model</text>
  <text x="52" y="375" fill="#A1A1AA" font-size="10">Top-oil &amp; hot-spot temp</text>
  <text x="52" y="390" fill="#A1A1AA" font-size="10">Arrhenius aging factor F_AA</text>
  <text x="52" y="405" fill="#71717A" font-size="10">Tick interval: 1500 ms</text>

  <rect x="40" y="430" width="212" height="90" rx="4" fill="#09090B" stroke="#3F3F46" stroke-width="1"/>
  <text x="52" y="450" fill="#F4F4F5" font-size="11" font-weight="700">Disturbance Scenarios</text>
  <text x="52" y="468" fill="#A1A1AA" font-size="10">[1] Nominal 50 Hz</text>
  <text x="52" y="482" fill="#A1A1AA" font-size="10">[2] Evening Peak Surge</text>
  <text x="52" y="496" fill="#A1A1AA" font-size="10">[3] Solar Cloud Cover</text>
  <text x="52" y="510" fill="#F43F5E" font-size="10">[4] Upstream Grid Outage</text>

  <rect x="296" y="82" width="516" height="454" rx="6" fill="#121215" stroke="#27272A" stroke-width="1.2"/>
  <rect x="296" y="82" width="516" height="32" rx="6" fill="#18181B"/>
  <text x="554" y="103" fill="#E4E4E7" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.8">2. CORE CONTROL &amp; ALGORITHMIC SUBSYSTEMS</text>

  <rect x="314" y="130" width="234" height="120" rx="4" fill="#09090B" stroke="#3F3F46" stroke-width="1"/>
  <text x="326" y="150" fill="#F4F4F5" font-size="11" font-weight="700">GridTopologyGraph + MinHeap</text>
  <text x="326" y="168" fill="#D4D4D8" font-size="10">Dynamic Feeder Impedance</text>
  <text x="326" y="186" fill="#A1A1AA" font-size="10">* Dijkstra Shortest-Loss Path</text>
  <text x="326" y="201" fill="#A1A1AA" font-size="10">  Source -&gt; LOAD-HOSP-01</text>
  <text x="326" y="218" fill="#A1A1AA" font-size="10">* Prim Radial Spanning Tree</text>
  <text x="326" y="233" fill="#A1A1AA" font-size="10">  Loop-free feeder topology</text>

  <rect x="562" y="130" width="234" height="120" rx="4" fill="#09090B" stroke="#3F3F46" stroke-width="1"/>
  <text x="574" y="150" fill="#F4F4F5" font-size="11" font-weight="700">Composite Zones &amp; Strategy</text>
  <text x="574" y="168" fill="#D4D4D8" font-size="10">Recursive Zone Power Tree</text>
  <text x="574" y="186" fill="#A1A1AA" font-size="10">* Proportional Droop Control</text>
  <text x="574" y="201" fill="#A1A1AA" font-size="10">* Aggressive Peak Shaving</text>
  <text x="574" y="216" fill="#A1A1AA" font-size="10">* Conservative Clinic Reserve</text>
  <text x="574" y="233" fill="#10B981" font-size="10">Runtime hot-swappable policy</text>

  <rect x="314" y="266" width="234" height="120" rx="4" fill="#09090B" stroke="#3F3F46" stroke-width="1"/>
  <text x="326" y="286" fill="#F4F4F5" font-size="11" font-weight="700">SynchronizedTelemetryMonitor</text>
  <text x="326" y="304" fill="#D4D4D8" font-size="10">Thread-Safe Concurrency Guard</text>
  <text x="326" y="322" fill="#A1A1AA" font-size="10">* Reentrant Mutex (RLock)</text>
  <text x="326" y="337" fill="#A1A1AA" font-size="10">* 32-Slot Bounded Ring Buffer</text>
  <text x="326" y="352" fill="#A1A1AA" font-size="10">* Compare-And-Swap (CAS) State</text>
  <text x="326" y="369" fill="#10B981" font-size="10">Zero race / zero dropped frames</text>

  <rect x="562" y="266" width="234" height="120" rx="4" fill="#09090B" stroke="#3F3F46" stroke-width="1"/>
  <text x="574" y="286" fill="#F4F4F5" font-size="11" font-weight="700">BreakerSafetyInterlock</text>
  <text x="574" y="304" fill="#D4D4D8" font-size="10">Propositional Invariant Gate</text>
  <text x="574" y="322" fill="#E4E4E7" font-size="10">(D -&gt; (S &amp; (Q|R|~P))) &amp; C</text>
  <text x="574" y="340" fill="#A1A1AA" font-size="10">P: Feeder On   Q: Load &gt; 82%</text>
  <text x="574" y="355" fill="#A1A1AA" font-size="10">R: Freq &lt; 49.65 S: SoC &gt; 15%</text>
  <text x="574" y="370" fill="#A1A1AA" font-size="10">D: BESS Active C: Clinic OK</text>

  <rect x="314" y="402" width="482" height="118" rx="4" fill="#09090B" stroke="#3F3F46" stroke-width="1"/>
  <text x="326" y="422" fill="#F4F4F5" font-size="11" font-weight="700">SQLite 3NF Relational Persistence &amp; Analytical Rollup Engine (WAL Mode)</text>
  <text x="326" y="442" fill="#A1A1AA" font-size="10">Tables: grid_nodes | storage_units | telemetry_readings | dispatch_events</text>
  <text x="326" y="460" fill="#D4D4D8" font-size="10">* Atomic ACID transactions with unique idempotency_key on state transitions</text>
  <text x="326" y="478" fill="#D4D4D8" font-size="10">* Real-time LEFT JOIN + GROUP BY node_type analytical rollups</text>
  <text x="326" y="498" fill="#10B981" font-size="10">PRAGMA journal_mode = WAL; PRAGMA foreign_keys = ON;</text>

  <rect x="840" y="82" width="256" height="454" rx="6" fill="#121215" stroke="#27272A" stroke-width="1.2"/>
  <rect x="840" y="82" width="256" height="32" rx="6" fill="#18181B"/>
  <text x="968" y="103" fill="#E4E4E7" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.8">3. SEPARATED DUAL WORKSPACES</text>

  <rect x="856" y="130" width="224" height="178" rx="4" fill="#09090B" stroke="#10B981" stroke-width="1.2"/>
  <text x="868" y="150" fill="#10B981" font-size="11" font-weight="700">Workspace A: Consumer Planner</text>
  <text x="868" y="166" fill="#71717A" font-size="9">DEFAULT VIEW (ZERO JARGON)</text>
  <text x="868" y="186" fill="#E4E4E7" font-size="10">* Home / Clinic / Business</text>
  <text x="868" y="204" fill="#A1A1AA" font-size="10">* Tap-to-select appliances</text>
  <text x="868" y="222" fill="#A1A1AA" font-size="10">* Standard vs GridPulse hours</text>
  <text x="868" y="240" fill="#A1A1AA" font-size="10">* Battery (kWh) &amp; Inverter</text>
  <text x="868" y="256" fill="#A1A1AA" font-size="10">  sizing recommendations</text>
  <text x="868" y="274" fill="#10B981" font-size="10">* Diesel fuel &amp; KES savings</text>
  <text x="868" y="294" fill="#71717A" font-size="9">Isolated from technical graphs</text>

  <rect x="856" y="324" width="224" height="196" rx="4" fill="#09090B" stroke="#3F3F46" stroke-width="1"/>
  <text x="868" y="344" fill="#F4F4F5" font-size="11" font-weight="700">Workspace B: Operator Console</text>
  <text x="868" y="360" fill="#71717A" font-size="9">DEDICATED ENGINEER MODE</text>
  <text x="868" y="380" fill="#D4D4D8" font-size="10">1. Overview: Corridor SLD,</text>
  <text x="868" y="394" fill="#A1A1AA" font-size="9">   sparklines, nodes &amp; ACID log</text>
  <text x="868" y="414" fill="#D4D4D8" font-size="10">2. Topology: Dijkstra route</text>
  <text x="868" y="428" fill="#A1A1AA" font-size="9">   &amp; Prim radial spanning tree</text>
  <text x="868" y="448" fill="#D4D4D8" font-size="10">3. Dispatch: BESS profiles,</text>
  <text x="868" y="462" fill="#A1A1AA" font-size="9">   zone tree &amp; RLock/CAS stats</text>
  <text x="868" y="482" fill="#D4D4D8" font-size="10">4. Protocol: 64-bit RTU hex,</text>
  <text x="868" y="496" fill="#A1A1AA" font-size="9">   safety interlock &amp; SQL rollup</text>

