  <rect width="1120" height="560" rx="12" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2"/>

  <rect x="24" y="20" width="1072" height="48" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
  <text x="44" y="49" fill="#F8FAFC" font-size="15" font-weight="700" letter-spacing="1.2">GRIDPULSE // END-TO-END TELEMETRY, DISPATCH AND PERSISTENCE ARCHITECTURE</text>
  <text x="1076" y="49" fill="#10B981" font-size="11" font-weight="600" text-anchor="end">NOMINAL BUS: 50.00 HZ / 240.0 V</text>

  <rect x="24" y="86" width="240" height="450" rx="8" fill="#0B1324" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="24" y="86" width="240" height="32" rx="8" fill="#111C33"/>
  <text x="144" y="107" fill="#38BDF8" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">1. FIELD TELEMETRY LAYER</text>

  <rect x="40" y="134" width="208" height="72" rx="6" fill="#0F172A" stroke="#0284C7" stroke-width="1.2"/>
  <text x="52" y="154" fill="#E2E8F0" font-size="11" font-weight="700">6-Node Kenyan Grid Twin</text>
  <text x="52" y="172" fill="#94A3B8" font-size="10">GEN-OLK-01 (450 kW Geo)</text>
  <text x="52" y="186" fill="#94A3B8" font-size="10">GEN-SOL-02 (280 kW PV)</text>
  <text x="52" y="200" fill="#94A3B8" font-size="10">TR-NRB-04 / BESS / Loads</text>

  <rect x="40" y="222" width="208" height="84" rx="6" fill="#0F172A" stroke="#06B6D4" stroke-width="1.2"/>
  <text x="52" y="242" fill="#22D3EE" font-size="11" font-weight="700">RTUBinaryCodec (64-Bit)</text>
  <text x="52" y="260" fill="#94A3B8" font-size="10">Fixed-point Q-format pack</text>
  <text x="52" y="275" fill="#94A3B8" font-size="10">Bitwise shift/mask framing</text>
  <text x="52" y="290" fill="#10B981" font-size="10">CRC-8 (Poly 0x07) verify</text>

  <rect x="40" y="322" width="208" height="92" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1.2"/>
  <text x="52" y="342" fill="#F8FAFC" font-size="11" font-weight="700">Physics &amp; Thermal Solver</text>
  <text x="52" y="360" fill="#94A3B8" font-size="10">50 Hz swing equation droop</text>
  <text x="52" y="375" fill="#94A3B8" font-size="10">Transformer oil inertia</text>
  <text x="52" y="390" fill="#94A3B8" font-size="10">LFP SoC Coulomb integration</text>
  <text x="52" y="405" fill="#F59E0B" font-size="10">Tick interval: 1500 ms</text>

  <rect x="40" y="430" width="208" height="90" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1.2"/>
  <text x="52" y="450" fill="#F8FAFC" font-size="11" font-weight="700">Scenario Fault Injector</text>
  <text x="52" y="468" fill="#94A3B8" font-size="10">[1] Nominal 50 Hz</text>
  <text x="52" y="482" fill="#94A3B8" font-size="10">[2] Evening Peak Surge</text>
  <text x="52" y="496" fill="#94A3B8" font-size="10">[3] Solar Cloud Transient</text>
  <text x="52" y="510" fill="#F43F5E" font-size="10">[4] Upstream Grid Blackout</text>

  <rect x="296" y="86" width="528" height="450" rx="8" fill="#0B1324" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="296" y="86" width="528" height="32" rx="8" fill="#111C33"/>
  <text x="560" y="107" fill="#10B981" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">2. CORE CONTROL &amp; ALGORITHMIC SUBSYSTEMS (FASTAPI ENGINE)</text>

  <rect x="314" y="134" width="240" height="118" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1.2"/>
  <text x="326" y="154" fill="#34D399" font-size="11" font-weight="700">GridTopologyGraph + MinHeap</text>
  <text x="326" y="172" fill="#CBD5E1" font-size="10">Dynamic Feeder Impedance Model</text>
  <text x="326" y="189" fill="#94A3B8" font-size="10">* Dijkstra Shortest-Loss Route</text>
  <text x="326" y="204" fill="#94A3B8" font-size="10">  Source -&gt; LOAD-HOSP-01</text>
  <text x="326" y="221" fill="#94A3B8" font-size="10">* Prim Radial Spanning Tree</text>
  <text x="326" y="236" fill="#94A3B8" font-size="10">  Loop-free feeder reconfiguration</text>

  <rect x="568" y="134" width="240" height="118" rx="6" fill="#0F172A" stroke="#06B6D4" stroke-width="1.2"/>
  <text x="580" y="154" fill="#22D3EE" font-size="11" font-weight="700">Composite Zones &amp; Strategy</text>
  <text x="580" y="172" fill="#CBD5E1" font-size="10">Recursive Power Aggregation Tree</text>
  <text x="580" y="189" fill="#94A3B8" font-size="10">* Proportional Droop Control</text>
  <text x="580" y="204" fill="#94A3B8" font-size="10">* Aggressive Peak Shaving</text>
  <text x="580" y="219" fill="#94A3B8" font-size="10">* Conservative Clinic Reserve</text>
  <text x="580" y="236" fill="#38BDF8" font-size="10">Runtime hot-swappable policy</text>

  <rect x="314" y="268" width="240" height="118" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="326" y="288" fill="#FBBF24" font-size="11" font-weight="700">SynchronizedTelemetryMonitor</text>
  <text x="326" y="306" fill="#CBD5E1" font-size="10">Thread-Safe Concurrency Guard</text>
  <text x="326" y="323" fill="#94A3B8" font-size="10">* Reentrant Mutex (RLock)</text>
  <text x="326" y="338" fill="#94A3B8" font-size="10">* 32-Slot Bounded Ring Buffer</text>
  <text x="326" y="353" fill="#94A3B8" font-size="10">* Compare-And-Swap (CAS) State</text>
  <text x="326" y="368" fill="#10B981" font-size="10">Zero race / zero dropped frames</text>

  <rect x="568" y="268" width="240" height="118" rx="6" fill="#0F172A" stroke="#A855F7" stroke-width="1.2"/>
  <text x="580" y="288" fill="#C084FC" font-size="11" font-weight="700">BreakerSafetyInterlock</text>
  <text x="580" y="306" fill="#CBD5E1" font-size="10">Propositional Invariant Gate</text>
  <text x="580" y="324" fill="#E2E8F0" font-size="10">Phi = (P v (S ^ B)) ^ ~T ^ F ^ C</text>
  <text x="580" y="342" fill="#94A3B8" font-size="10">P: PCC Online  S: Island Mode</text>
  <text x="580" y="357" fill="#94A3B8" font-size="10">B: BESS &gt; 15%  T: Load &gt; 95%</text>
  <text x="580" y="372" fill="#94A3B8" font-size="10">F: Freq &gt;= 49.2Hz C: Clinic OK</text>

  <rect x="314" y="402" width="494" height="118" rx="6" fill="#0F172A" stroke="#3B82F6" stroke-width="1.2"/>
  <text x="326" y="422" fill="#60A5FA" font-size="11" font-weight="700">SQLite 3NF Relational Persistence &amp; Analytical Rollup Engine (WAL Mode)</text>
  <text x="326" y="442" fill="#94A3B8" font-size="10">Tables: grid_nodes | storage_units | telemetry_readings | dispatch_events</text>
  <text x="326" y="460" fill="#CBD5E1" font-size="10">* Atomic ACID transactions with unique idempotency_key (EVT-tick-uuid) on all state transitions</text>
  <text x="326" y="478" fill="#CBD5E1" font-size="10">* Real-time LEFT JOIN + GROUP BY node_type analytical queries for capacity &amp; peak load auditing</text>
  <text x="326" y="498" fill="#10B981" font-size="10">PRAGMA journal_mode = WAL; PRAGMA foreign_keys = ON;</text>

  <rect x="856" y="86" width="240" height="450" rx="8" fill="#0B1324" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="856" y="86" width="240" height="32" rx="8" fill="#111C33"/>
  <text x="976" y="107" fill="#F59E0B" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">3. OPERATOR CONTROL UI</text>

  <rect x="872" y="134" width="208" height="82" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1.2"/>
