  <text x="894" y="302" fill="#94A3B8" font-size="9">6-Node Cards, SVG Oscilloscope,</text>
  <text x="894" y="313" fill="#94A3B8" font-size="9">Fault Deck, ACID Event Ledger</text>

  <rect x="884" y="328" width="184" height="52" rx="4" fill="#111C33" stroke="#1E293B"/>
  <text x="894" y="346" fill="#34D399" font-size="10" font-weight="700">Tab 2: Feeder Graph Routing</text>
  <text x="894" y="362" fill="#94A3B8" font-size="9">Dijkstra Hospital Route,</text>
  <text x="894" y="373" fill="#94A3B8" font-size="9">Prim Radial Spanning Topology</text>

  <rect x="884" y="388" width="184" height="52" rx="4" fill="#111C33" stroke="#1E293B"/>
  <text x="894" y="406" fill="#FBBF24" font-size="10" font-weight="700">Tab 3: Dispatch &amp; Mutex</text>
  <text x="894" y="422" fill="#94A3B8" font-size="9">Live BESS Strategy Switcher,</text>
  <text x="894" y="433" fill="#94A3B8" font-size="9">Zone Tree, RLock &amp; CAS Metrics</text>

  <rect x="884" y="448" width="184" height="56" rx="4" fill="#111C33" stroke="#1E293B"/>
  <text x="894" y="466" fill="#C084FC" font-size="10" font-weight="700">Tab 4: RTU &amp; Interlocks</text>
  <text x="894" y="482" fill="#94A3B8" font-size="9">64-Bit Hex/Binary Inspector,</text>
  <text x="894" y="493" fill="#94A3B8" font-size="9">Boolean Gate &amp; SQL Rollups</text>

