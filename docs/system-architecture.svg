  <text x="884" y="172" fill="#94A3B8" font-size="10">Primary: WebSocket /ws</text>
  <text x="884" y="187" fill="#94A3B8" font-size="10">Control: REST /api/*</text>
  <text x="884" y="202" fill="#F59E0B" font-size="10">Fallback: Edge Twin Engine</text>

  <rect x="872" y="232" width="208" height="288" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1.2"/>
