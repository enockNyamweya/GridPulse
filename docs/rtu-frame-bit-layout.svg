<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 320" width="100%" height="100%" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
  <rect width="1120" height="320" rx="8" fill="#09090B" stroke="#27272A" stroke-width="1.5"/>

  <rect x="24" y="20" width="1072" height="40" rx="4" fill="#18181B" stroke="#27272A" stroke-width="1"/>
  <text x="40" y="45" fill="#F4F4F5" font-size="13" font-weight="600" letter-spacing="0.5">64-BIT (8-BYTE) RTU BINARY TELEMETRY FRAME SPECIFICATION (BIG-ENDIAN)</text>
  <text x="1080" y="45" fill="#10B981" font-size="11" font-weight="500" text-anchor="end">CRC-8 POLYNOMIAL: 0x07</text>

  <text x="24" y="84" fill="#71717A" font-size="10" font-weight="600">BYTE / BIT OFFSETS: MSB [63] TO LSB [0]</text>

  <rect x="24" y="96" width="140" height="88" rx="4" fill="#121215" stroke="#3F3F46" stroke-width="1.2"/>
  <text x="94" y="118" fill="#A1A1AA" font-size="10" font-weight="600" text-anchor="middle">BYTE 0 [63:56]</text>
  <text x="94" y="140" fill="#F4F4F5" font-size="12" font-weight="700" text-anchor="middle">SYNC_HEADER</text>
  <text x="94" y="158" fill="#71717A" font-size="10" text-anchor="middle">Fixed 0xA5</text>
  <text x="94" y="174" fill="#52525B" font-size="9" text-anchor="middle">Frame alignment</text>

  <rect x="172" y="96" width="184" height="88" rx="4" fill="#121215" stroke="#3F3F46" stroke-width="1.2"/>
  <text x="264" y="118" fill="#A1A1AA" font-size="10" font-weight="600" text-anchor="middle">BYTE 1 [55:48]</text>
  <text x="264" y="140" fill="#F4F4F5" font-size="12" font-weight="700" text-anchor="middle">NODE_ID | FLAGS</text>
  <text x="264" y="158" fill="#71717A" font-size="10" text-anchor="middle">[7:4] ID | [3:0] Status</text>
  <text x="264" y="174" fill="#52525B" font-size="9" text-anchor="middle">ON | FLT | BESS | PRIO</text>

  <rect x="364" y="96" width="208" height="88" rx="4" fill="#121215" stroke="#3F3F46" stroke-width="1.2"/>
  <text x="468" y="118" fill="#A1A1AA" font-size="10" font-weight="600" text-anchor="middle">BYTES 2..3 [47:32]</text>
  <text x="468" y="140" fill="#F4F4F5" font-size="12" font-weight="700" text-anchor="middle">VOLTAGE_UINT16</text>
  <text x="468" y="158" fill="#71717A" font-size="10" text-anchor="middle">Decivolts (V x 10)</text>
  <text x="468" y="174" fill="#52525B" font-size="9" text-anchor="middle">240.0 V -&gt; 0x0960</text>

  <rect x="580" y="96" width="208" height="88" rx="4" fill="#121215" stroke="#3F3F46" stroke-width="1.2"/>
  <text x="684" y="118" fill="#A1A1AA" font-size="10" font-weight="600" text-anchor="middle">BYTES 4..5 [31:16]</text>
  <text x="684" y="140" fill="#F4F4F5" font-size="12" font-weight="700" text-anchor="middle">FREQUENCY_UINT16</text>
  <text x="684" y="158" fill="#71717A" font-size="10" text-anchor="middle">Centihertz (Hz x 100)</text>
  <text x="684" y="174" fill="#52525B" font-size="9" text-anchor="middle">50.00 Hz -&gt; 0x1388</text>

  <rect x="796" y="96" width="144" height="88" rx="4" fill="#121215" stroke="#3F3F46" stroke-width="1.2"/>
  <text x="868" y="118" fill="#A1A1AA" font-size="10" font-weight="600" text-anchor="middle">BYTE 6 [15:8]</text>
  <text x="868" y="140" fill="#F4F4F5" font-size="12" font-weight="700" text-anchor="middle">LOAD_UINT8</text>
  <text x="868" y="158" fill="#71717A" font-size="10" text-anchor="middle">0..255% Load</text>
  <text x="868" y="174" fill="#52525B" font-size="9" text-anchor="middle">70% -&gt; 0x46</text>

  <rect x="948" y="96" width="148" height="88" rx="4" fill="#121215" stroke="#10B981" stroke-width="1.2"/>
  <text x="1022" y="118" fill="#10B981" font-size="10" font-weight="600" text-anchor="middle">BYTE 7 [7:0]</text>
  <text x="1022" y="140" fill="#F4F4F5" font-size="12" font-weight="700" text-anchor="middle">CRC8_CHECKSUM</text>
  <text x="1022" y="158" fill="#71717A" font-size="10" text-anchor="middle">Poly x^8+x^2+x+1</text>
  <text x="1022" y="174" fill="#10B981" font-size="9" text-anchor="middle">Bytes 0..6 Check</text>

  <rect x="24" y="204" width="1072" height="92" rx="4" fill="#121215" stroke="#27272A" stroke-width="1"/>
  <text x="40" y="228" fill="#E4E4E7" font-size="11" font-weight="600">STATUS NIBBLE REGISTER (BYTE 1 LOW NIBBLE [3:0]) &amp; WIRE FRAME EXAMPLE:</text>
  <text x="40" y="250" fill="#A1A1AA" font-size="10">Bit 3 (0x08): ONLINE_ENERGIZED   |   Bit 2 (0x04): FAULT_OR_OVERLOAD   |   Bit 1 (0x02): BESS_ACTIVE   |   Bit 0 (0x01): PRIORITY_1_PROTECTED</text>
  <text x="40" y="274" fill="#71717A" font-size="10">Example Wire Frame (TR-NRB-04 @ 240.0 V, 50.00 Hz, 70% Load):   0xA5 0x38 0x09 0x60 0x13 0x88 0x46 0x3C   [CRC-8 VALID]</text>
</svg>
