<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 340" width="100%" height="100%" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
  <defs>
    <linearGradient id="rtuBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <rect width="1120" height="340" rx="12" fill="url(#rtuBg)" stroke="#1E293B" stroke-width="2"/>

  <rect x="24" y="20" width="1072" height="42" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
  <text x="44" y="46" fill="#F8FAFC" font-size="14" font-weight="700" letter-spacing="1">64-BIT (8-BYTE) RTU BINARY TELEMETRY PACKET SPECIFICATION // BIG-ENDIAN WIRE FORMAT</text>
  <text x="1076" y="46" fill="#22D3EE" font-size="11" font-weight="600" text-anchor="end">CRC-8 POLYNOMIAL: 0x07</text>

  <text x="44" y="88" fill="#94A3B8" font-size="11" font-weight="700">BIT OFFSETS: MSB [63] TO LSB [0]</text>

  <rect x="44" y="102" width="130" height="88" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="109" y="122" fill="#38BDF8" font-size="11" font-weight="700" text-anchor="middle">BITS [63:56]</text>
  <text x="109" y="142" fill="#F8FAFC" font-size="12" font-weight="700" text-anchor="middle">NODE_ID</text>
  <text x="109" y="160" fill="#94A3B8" font-size="10" text-anchor="middle">8-Bit Unsigned</text>
  <text x="109" y="176" fill="#64748B" font-size="9" text-anchor="middle">Byte 0 (0x01..0x06)</text>

  <rect x="180" y="102" width="140" height="88" rx="4" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="250" y="122" fill="#FBBF24" font-size="11" font-weight="700" text-anchor="middle">BITS [55:48]</text>
  <text x="250" y="142" fill="#F8FAFC" font-size="12" font-weight="700" text-anchor="middle">STATUS_FLAGS</text>
  <text x="250" y="160" fill="#94A3B8" font-size="10" text-anchor="middle">8-Bit Bitmask</text>
  <text x="250" y="176" fill="#64748B" font-size="9" text-anchor="middle">Byte 1 (Bit0..Bit3)</text>

  <rect x="326" y="102" width="214" height="88" rx="4" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <text x="433" y="122" fill="#34D399" font-size="11" font-weight="700" text-anchor="middle">BITS [47:32]</text>
  <text x="433" y="142" fill="#F8FAFC" font-size="12" font-weight="700" text-anchor="middle">ACTIVE_POWER_KW</text>
  <text x="433" y="160" fill="#94A3B8" font-size="10" text-anchor="middle">16-Bit Two's Complement</text>
  <text x="433" y="176" fill="#64748B" font-size="9" text-anchor="middle">Bytes 2..3 (Scale: kW x 10)</text>

  <rect x="546" y="102" width="214" height="88" rx="4" fill="#0F172A" stroke="#06B6D4" stroke-width="1.5"/>
  <text x="653" y="122" fill="#22D3EE" font-size="11" font-weight="700" text-anchor="middle">BITS [31:16]</text>
  <text x="653" y="142" fill="#F8FAFC" font-size="12" font-weight="700" text-anchor="middle">BUS_VOLTAGE_V</text>
  <text x="653" y="160" fill="#94A3B8" font-size="10" text-anchor="middle">16-Bit Unsigned Int</text>
  <text x="653" y="176" fill="#64748B" font-size="9" text-anchor="middle">Bytes 4..5 (Scale: V x 10)</text>

  <rect x="766" y="102" width="166" height="88" rx="4" fill="#0F172A" stroke="#A855F7" stroke-width="1.5"/>
  <text x="849" y="122" fill="#C084FC" font-size="11" font-weight="700" text-anchor="middle">BITS [15:4]</text>
  <text x="849" y="142" fill="#F8FAFC" font-size="12" font-weight="700" text-anchor="middle">FREQ_OFFSET</text>
  <text x="849" y="160" fill="#94A3B8" font-size="10" text-anchor="middle">12-Bit Unsigned</text>
  <text x="849" y="176" fill="#64748B" font-size="9" text-anchor="middle">(Hz - 45.00) x 100</text>

  <rect x="938" y="102" width="138" height="88" rx="4" fill="#0F172A" stroke="#F43F5E" stroke-width="1.5"/>
  <text x="1007" y="122" fill="#FB7185" font-size="11" font-weight="700" text-anchor="middle">BYTE 7 [7:0]</text>
  <text x="1007" y="142" fill="#F8FAFC" font-size="12" font-weight="700" text-anchor="middle">CRC8_CHECKSUM</text>
  <text x="1007" y="160" fill="#94A3B8" font-size="10" text-anchor="middle">Poly x^8+x^2+x+1</text>
  <text x="1007" y="176" fill="#64748B" font-size="9" text-anchor="middle">Computed on Bytes 0..6</text>

  <rect x="44" y="210" width="1032" height="106" rx="6" fill="#0B1324" stroke="#1E293B" stroke-width="1.5"/>
  <text x="64" y="234" fill="#E2E8F0" font-size="11" font-weight="700">STATUS_FLAGS BITMASK REGISTER (BITS [55:48]) &amp; WIRE ENCODING EXAMPLE:</text>
  <text x="64" y="256" fill="#34D399" font-size="10">Bit 0 (0x01): ONLINE_ENERGIZED</text>
  <text x="290" y="256" fill="#FBBF24" font-size="10">Bit 1 (0x02): THERMAL_OVERLOAD (&gt;85%)</text>
  <text x="560" y="256" fill="#22D3EE" font-size="10">Bit 2 (0x04): PRIORITY_CRITICAL</text>
  <text x="800" y="256" fill="#C084FC" font-size="10">Bit 3 (0x08): CURTAILED_OR_DISCHARGING</text>
  <text x="64" y="282" fill="#94A3B8" font-size="10">Example Frame (TR-NRB-04 @ 348.0 kW, 240.0 V, 50.00 Hz):  HEX = 0x03010D9809601F4A  |  CRC-8 VALIDATED = TRUE</text>
  <text x="64" y="300" fill="#64748B" font-size="10">Packing Formula: (node_idx &lt;&lt; 56) | (flags &lt;&lt; 48) | (p_twos16 &lt;&lt; 32) | (v_uint16 &lt;&lt; 16) | (f_uint12 &lt;&lt; 4) ^ crc8</text>
</svg>
